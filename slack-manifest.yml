display_information:
  name: Team Sprint
  description: Turn everyday movement into a game your team wants to play.
  background_color: "#2563eb"
features:
  bot_user:
    display_name: team-sprint
    always_online: true
  slash_commands:
    - command: /fitness
      description: Team Sprint - view progress, team, leaderboard, and challenge info
      usage_hint: "[today|team|leaderboard|challenge|profile|help]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
      - users:read
      - team:read
      - im:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
